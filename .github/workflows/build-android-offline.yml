name: Build Android APK & Linux Desktop (Offline & Auto-Download)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.35.2
  FLUTTER_CHANNEL: master

permissions:
  contents: write

jobs:
  build_linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          git-source: https://github.com/flutter/flutter.git

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget tar xz-utils clang cmake ninja-build pkg-config libgtk-3-dev make python3-pip python3-setuptools desktop-file-utils libgdk-pixbuf2.0-dev fakeroot patchelf gir1.2-appindicator3-0.1 libappindicator3-1 libappindicator3-dev libsecret-1-0 libsecret-1-dev libjsoncpp-dev libnotify-bin libnotify-dev mpv libmpv-dev libwebkit2gtk-4.1-0 libwebkit2gtk-4.1-dev libsoup-3.0-0 libsoup-3.0-dev

      - name: Build Linux Release Bundle
        run: |
          flutter pub get
          flutter build linux --release
          mkdir -p dist /tmp/spotube-tar
          cp -r build/linux/x64/release/bundle/* /tmp/spotube-tar/
          cp linux/spotube.desktop /tmp/spotube-tar/spotube.desktop
          cp linux/com.github.KRTirtho.Spotube.appdata.xml /tmp/spotube-tar/com.github.KRTirtho.Spotube.appdata.xml
          cp assets/branding/spotube-logo.png /tmp/spotube-tar/spotube-logo.png
          tar -cJf dist/Spotube-linux-x86_64.tar.xz -C /tmp/spotube-tar .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotube-linux-x86_64
          path: dist/Spotube-linux-x86_64.tar.xz

      - name: Publish Linux Bundle to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v5.1.2-offline
          name: "v5.1.2-offline - Android APK & Linux Desktop (Offline Liked Songs & Auto-Download)"
          body: |
            Custom build of Spotube v5.1.2 for Android & Linux Desktop with:
            - **Download Status Badge in Liked Songs & Playlists:** Shows a Spotify-style green badge and status icon next to every song so you immediately see which tracks are downloaded and which are not.
            - **100% Native Offline Liked Songs (Canciones Favoritas):** Caches your Liked Songs locally (`SharedPreferences`) and plays them directly from your Downloads folder (`/storage/emulated/0/Download/Spotube` on Android, `~/Descargas/Spotube` on Linux) when you have no internet — no external helper service needed.
            - **Auto-Download on Heart (❤️):** Automatically queues and downloads any song you mark as Favorite (Me gusta).
            - **Pagination Race Condition & Memory Fix:** Prevents concurrent `fetchAll()` loops from duplicating songs and eliminates recursive download queue memory leaks.
          allowUpdates: true
          artifacts: dist/Spotube-linux-x86_64.tar.xz

  build_android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          git-source: https://github.com/flutter/flutter.git

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          check-latest: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Android dependencies
        run: |
          flutter pub get
          dart cli/cli.dart install-dependencies --platform=android --arch=all

      - name: Setup Release Keystore
        run: |
          if [ ! -f android/app/upload-keystore.jks ]; then
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -storepass spotube123 \
              -keypass spotube123 \
              -dname "CN=Spotube, OU=Dev, O=Spotube, L=City, S=State, C=MX"
          fi
          cat << 'EOF' > android/key.properties
          storePassword=spotube123
          keyPassword=spotube123
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android APK
        run: dart cli/cli.dart build --arch=all android
        env:
          CHANNEL: stable
          DOTENV: |
            LASTFM_API_KEY=00000000000000000000000000000000
            LASTFM_API_SECRET=00000000000000000000000000000000
            HIDE_DONATIONS=0
            ENABLE_UPDATE_CHECK=0

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotube-android-all-arch
          path: build/Spotube-android-all-arch.apk

      - name: Publish Android APK to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v5.1.2-offline
          name: "v5.1.2-offline - Android APK & Linux Desktop (Offline Liked Songs & Auto-Download)"
          body: |
            Custom build of Spotube v5.1.2 for Android & Linux Desktop with:
            - **Download Status Badge in Liked Songs & Playlists:** Shows a Spotify-style green badge and status icon next to every song so you immediately see which tracks are downloaded and which are not.
            - **100% Native Offline Liked Songs (Canciones Favoritas):** Caches your Liked Songs locally (`SharedPreferences`) and plays them directly from your Downloads folder (`/storage/emulated/0/Download/Spotube` on Android, `~/Descargas/Spotube` on Linux) when you have no internet — no external helper service needed.
            - **Auto-Download on Heart (❤️):** Automatically queues and downloads any song you mark as Favorite (Me gusta).
            - **Pagination Race Condition & Memory Fix:** Prevents concurrent `fetchAll()` loops from duplicating songs and eliminates recursive download queue memory leaks.
          allowUpdates: true
          artifacts: build/Spotube-android-all-arch.apk
